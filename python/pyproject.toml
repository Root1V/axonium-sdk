[project]
name = "axonium"
dynamic = ["version"]
description = "Python SDK for the Prometheus Gateway inference API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emeric Espiritu Santiago" }]
keywords = ["llm", "inference", "prometheus-gateway", "openai-compatible", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25"]

[project.urls]
Homepage = "https://github.com/Root1V/axonium-sdk"
Repository = "https://github.com/Root1V/axonium-sdk"
Changelog = "https://github.com/Root1V/axonium-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/axonium/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/axonium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: hits a real deployment; requires AXONIUM_INTEGRATION=1 and credentials",
]

[tool.coverage.run]
source = ["axonium"]
branch = true

[tool.coverage.report]
# The suite reaches 100% line and branch coverage today. The gate sits a little below that so an
# unrelated change does not fail CI on a single defensive branch, while still blocking any real
# regression in coverage.
fail_under = 98
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/axonium"]
