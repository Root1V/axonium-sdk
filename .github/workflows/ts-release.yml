name: ts-release

# Publishes to npm with provenance via OIDC -- no token is stored anywhere.
#
# One-time setup required by the package owner before the first run:
#   1. On npm, the name `axonium` is unclaimed (404 on 2026-10-03), so the first publish claims it.
#      Configure a trusted publisher for it: owner `Root1V`, repository `axonium-sdk`, workflow
#      `ts-release.yml`, environment `npm`.
#   2. Create the `npm` environment in this repository's settings, with a required reviewer. An npm
#      version can be deprecated and unpublished only within 72 hours, and never reused.
#
# A tag publishes. There is no TestPyPI equivalent for npm, so the rehearsal is `npm pack` plus an
# install of the tarball into a clean directory, which the build job does and uploads.

on:
  push:
    tags: ["ts/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only; do not publish"
        required: false
        default: true
        type: boolean

defaults:
  run:
    working-directory: typescript

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Tag matches the packaged version
        # Publishing a tarball whose version disagrees with its tag is unfixable after the fact: an npm
        # version can never be reused.
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#ts/v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::Tag says $tagged but the package says $packaged" >&2
            exit 1
          fi
          echo "Both say $packaged"

      - run: npm ci
      # Builds first, because `lint` typechecks the examples against the published .d.ts and so needs
      # the build to exist. `lint` now produces it itself, and the order here is belt and braces -- the
      # first run of this workflow failed exactly here while `npm run lint` passed locally, on a dist/
      # left over from an earlier build.
      - run: npm run build
      - run: npm run lint
      - run: npm test

      - name: The tarball ships what it should and no more
        # `files` in package.json is the allowlist and the only one: a `.npmignore` alongside it silently
        # overrode it and dropped docs/ from the tarball, which is why there is no `.npmignore` here.
        run: |
          npm pack --silent
          tarball="$(ls axonium-*.tgz)"
          echo "contents of $tarball:"
          tar tzf "$tarball" | sort

          for required in dist/esm/index.js dist/esm/index.d.ts dist/cjs/index.cjs docs/api.md LICENSE; do
            tar tzf "$tarball" | grep -q "package/$required" || {
              echo "::error::the tarball is missing $required" >&2; exit 1; }
          done

          # Tests and configs have no business in a published package.
          if tar tzf "$tarball" | grep -Eq 'package/(test|examples|tsconfig)'; then
            echo "::error::the tarball ships tests, examples or tsconfigs" >&2
            exit 1
          fi

          # Every sourcemap must find its sources INSIDE the tarball. A map pointing at a file that is
          # not there is worse than no map: a debugger reports "file not found" rather than falling back
          # to the compiled output, and that is how this shipped the first time.
          work="$(mktemp -d)"
          tar xzf "$tarball" -C "$work"
          node -e '
            const { readFileSync, existsSync } = require("node:fs");
            const { join, dirname, resolve } = require("node:path");
            const { globSync } = require("node:fs");
            const root = join(process.argv[1], "package");
            const maps = globSync("dist/**/*.map", { cwd: root }).map((p) => join(root, p));
            if (maps.length === 0) throw new Error("no sourcemaps found; the check matched nothing");
            const broken = [];
            for (const map of maps) {
              const { sources } = JSON.parse(readFileSync(map, "utf8"));
              for (const source of sources) {
                if (!existsSync(resolve(dirname(map), source))) broken.push(`${map} -> ${source}`);
              }
            }
            if (broken.length) throw new Error("sourcemaps with missing sources:\n" + broken.join("\n"));
            console.log(`${maps.length} sourcemaps, all sources present`);
          ' "$work"

      - name: It installs and works from the tarball, on the oldest supported Node
        run: |
          tarball="$PWD/$(ls axonium-*.tgz)"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y --silent >/dev/null
          npm install --silent "$tarball"
          node -e '
            const { resolveConfig, errorFromProblem, VERSION } = require("axonium");
            const cfg = resolveConfig({ gatewayBaseURL: "https://g.test", clientId: "a", clientSecret: "b" });
            if (!cfg.gatewayBaseURL) throw new Error("config did not resolve");
            const err = errorFromProblem({ status: 403, typeSuffix: "forbidden", title: "", detail: "d",
              instance: "", retryAfter: undefined, raw: {},
              meta: { requestId: undefined, traceId: undefined, instance: undefined, instanceId: undefined,
                      idempotentReplay: false, idempotentReplayOf: undefined, rateLimit: undefined } });
            if (err.name !== "ForbiddenError") throw new Error("taxonomy lost: " + err.name);
            console.log("cjs ok:", VERSION, err.name);
          '
          node --input-type=module -e 'const m = await import("axonium"); console.log("esm ok:", m.VERSION);'

      - name: The bundle fits the size budget
        # Apeiron asked for under 50 KB minified and gzipped. Measured rather than assumed, because a
        # transitive dependency is how that budget quietly becomes 400 KB.
        run: |
          npx --yes esbuild@0.24 src/index.ts --bundle --minify --format=esm \
            --platform=neutral --outfile=/tmp/bundle.js
          bytes="$(gzip -9 -c /tmp/bundle.js | wc -c | tr -d ' ')"
          echo "minified + gzipped: $bytes bytes"
          echo "minified + gzipped: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 51200 ]; then
            echo "::error::$bytes bytes exceeds the 50 KB budget" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: typescript/axonium-*.tgz

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v7
        with:
          name: tarball
          path: typescript/
      # --provenance needs id-token: write above, and ties the published tarball to this workflow run
      # and this commit. It is what lets a consumer verify the package was built from this source.
      - run: npm publish --provenance --access public axonium-*.tgz
