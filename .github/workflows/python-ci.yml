name: python-ci

on:
  push:
    branches: [main]
    paths: ["python/**", "spec/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", "spec/**", ".github/workflows/python-ci.yml"]

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      # v7 rather than the newer v10.1.0: v7 is the last major with a floating tag, so it keeps
      # picking up patches the way every other action here does. Pinning an exact v10.1.0 would be
      # the only hand-maintained version in these workflows, and would quietly rot.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src/
      - run: uv run pytest --cov --cov-report=term-missing
