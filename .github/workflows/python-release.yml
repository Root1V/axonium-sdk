name: python-release

# Publishes the Python SDK via PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# One-time setup required by the repository owner before the first run:
#   1. On PyPI, add a *pending publisher* for the project name `axonium` (the name is unclaimed,
#      so this is the pending-publisher flow rather than adding one to an existing project):
#      owner `Root1V`, repository `axonium-sdk`, workflow `python-release.yml`, environment `pypi`.
#   2. Repeat on TestPyPI with environment `testpypi`, if you want the dry run.
#   3. Create both environments in this repository's settings. A required reviewer on `pypi` is
#      worth having: a release cannot be unpublished, only yanked.
#
# A tag publishes to PyPI, but only if that exact version already exists on TestPyPI. Use the
# manual dispatch to rehearse there first -- it is enforced, not advised. See the `testpypi-gate`
# job for why.

on:
  push:
    tags: ["python/v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      acknowledge_breaking:
        description: "This release removes or re-types public surface, and that has been announced"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # v7 rather than the newer v10.1.0: v7 is the last major with a floating tag, so it keeps
      # picking up patches the way every other action here does. Pinning an exact v10.1.0 would be
      # the only hand-maintained version in these workflows, and would quietly rot.
      - uses: astral-sh/setup-uv@v7

      - name: Tag matches the packaged version
        # Publishing a wheel whose version disagrees with its tag is unfixable after the fact,
        # since a version can never be reused on PyPI.
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#python/v}"
          packaged="$(grep -oE '"[^"]+"' src/axonium/_version.py | tr -d '"')"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag says $tagged but the package says $packaged" >&2
            exit 1
          fi
          echo "Both say $packaged"
        working-directory: python

      - run: uv build
        working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  # The public surface is compared here and nowhere else, on purpose. The testpypi-gate makes this
  # rehearsal mandatory before any tag can publish, so putting the comparison inside it makes
  # *seeing* the diff mandatory too -- without a second gate to remember. One chain: no tag without
  # a rehearsal, no rehearsal without looking at what changed shape.
  surface:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: What changed shape since the last release
        run: |
          python scripts/surface_diff.py \
            ${{ inputs.acknowledge_breaking && '--acknowledge-breaking' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

  testpypi:
    needs: [build, surface]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Refuses to publish a version that has not been rehearsed on TestPyPI. This exists because the
  # rehearsal was a comment in this file asking the releaser to remember, and on 2026-09-16 the
  # releaser did not: 1.0.0rc4 went to PyPI having never been to TestPyPI. The rehearsal is the
  # step that caught the rc2 packaging defect, and a PyPI version can never be reused, so the
  # failure it prevents is permanent. A control that depends on someone remembering is not a
  # control.
  testpypi-gate:
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: This version has been rehearsed on TestPyPI
        working-directory: python
        run: |
          version="$(grep -oE '"[^"]+"' src/axonium/_version.py | tr -d '"')"
          url="https://test.pypi.org/pypi/axonium/${version}/json"
          # --retry covers a blip; it must not turn an outage into a pass. The `|| true` is not
          # laziness: Actions runs this under `bash -e`, so an unreachable index would abort here
          # and the operator would read curl's error instead of the one below -- failing for a
          # reason that is not the reason. curl writes 000 when it never got a response.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url" || true)"

          case "$code" in
            200)
              echo "$version is on TestPyPI. Proceeding."
              ;;
            404)
              echo "::error::$version has never been published to TestPyPI." >&2
              echo "Rehearse it first: Actions -> python-release -> Run workflow -> testpypi," >&2
              echo "then re-run this release. Nothing has been published to PyPI." >&2
              exit 1
              ;;
            *)
              # Deliberately a different message from the 404. A check that reports the wrong
              # reason for failing is one people learn to override.
              echo "::error::Could not reach TestPyPI (HTTP $code). This is not a verdict on" >&2
              echo "whether $version was rehearsed -- it means the gate could not tell." >&2
              exit 1
              ;;
          esac

  pypi:
    needs: [build, testpypi-gate]
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
