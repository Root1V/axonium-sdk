name: python-release

# Publishes the Python SDK via PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# One-time setup required by the repository owner before the first run:
#   1. On PyPI, add a *pending publisher* for the project name `axonium` (the name is unclaimed,
#      so this is the pending-publisher flow rather than adding one to an existing project):
#      owner `Root1V`, repository `axonium-sdk`, workflow `python-release.yml`, environment `pypi`.
#   2. Repeat on TestPyPI with environment `testpypi`, if you want the dry run.
#   3. Create both environments in this repository's settings. A required reviewer on `pypi` is
#      worth having: a release cannot be unpublished, only yanked.
#
# A tag publishes to PyPI. Use the manual dispatch for a TestPyPI dry run first.

on:
  push:
    tags: ["python/v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Tag matches the packaged version
        # Publishing a wheel whose version disagrees with its tag is unfixable after the fact,
        # since a version can never be reused on PyPI.
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#python/v}"
          packaged="$(grep -oE '"[^"]+"' src/axonium/_version.py | tr -d '"')"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag says $tagged but the package says $packaged" >&2
            exit 1
          fi
          echo "Both say $packaged"
        working-directory: python

      - run: uv build
        working-directory: python

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
