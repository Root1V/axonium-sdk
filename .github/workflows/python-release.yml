name: python-release

# Publishes the Python SDK to PyPI via Trusted Publishing (OIDC) — no API token is stored.
#
# One-time setup required by the repository owner before the first run:
#   1. On PyPI, add a *pending publisher* for the project name `axonium`:
#      owner `Root1V`, repository `axonium-sdk`, workflow `python-release.yml`,
#      environment `pypi`.
#   2. In this repository's settings, create the `pypi` environment (adding a required reviewer
#      is recommended, since a publish cannot be undone).

on:
  push:
    tags: ["python/v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

defaults:
  run:
    working-directory: python

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
                && 'https://test.pypi.org/legacy/' || '' }}
