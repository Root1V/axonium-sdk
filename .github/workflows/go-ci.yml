name: go-ci

on:
  push:
    branches: [main]
    paths: ["go/**", "spec/**", ".github/workflows/go-ci.yml"]
  pull_request:
    paths: ["go/**", "spec/**", ".github/workflows/go-ci.yml"]

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
