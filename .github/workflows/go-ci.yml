name: go-ci

on:
  push:
    branches: [main]
    paths: ["go/**", "spec/**", ".github/workflows/go-ci.yml"]
  pull_request:
    paths: ["go/**", "spec/**", ".github/workflows/go-ci.yml"]

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: the version guard below compares against the go/v* tags, and the default
        # single-commit fetch brings none of them -- which would make the check pass by seeing
        # nothing.
        with:
          fetch-depth: 0

      - name: The Version constant has not fallen behind the newest tag
        working-directory: .
        run: ./scripts/check_go_version.sh

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          # No cache-dependency-path: this module has no third-party dependencies, so there is no
          # go.sum to key a cache on. Standard library only is deliberate for an SDK that other
          # people will vendor.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # The race detector is not optional here: this SDK caches tokens and refreshes them under
      # concurrency, which is exactly where a data race would hide.
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
