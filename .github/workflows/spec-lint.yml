name: spec-lint

# The spec directory is the contract all four SDKs are built against, so a malformed file there
# breaks every language at once. This validates it independently of any SDK's test suite.
#
# ROADMAP.md is in the paths below, which looks out of place and is not. Every other workflow here
# is scoped to a language directory, so a commit touching only ROADMAP.md ran NO ci at all -- which
# is how two rows ended up numbered AXO-118, each referenced from a different published commit. The
# ids are the vocabulary the changelog and the channel messages to other teams are written in, so
# they are closer to a contract than to prose. This is the only workflow with no language of its own.

on:
  push:
    branches: [main]
    paths: ["spec/**", "ROADMAP.md", "scripts/check_roadmap_ids.py", ".github/workflows/spec-lint.yml"]
  pull_request:
    paths: ["spec/**", "ROADMAP.md", "scripts/check_roadmap_ids.py", ".github/workflows/spec-lint.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The catalog still matches the vendored guide
        # The guard from errors.json to the SDKs already exists. This is the missing direction:
        # the platform documents a new error, the guide is re-vendored, and nothing notices that
        # the catalog did not grow. That is how 400 unknown-parameter sat here for days.
        run: python scripts/check_catalog_matches_guide.py

      - name: Roadmap ids are unique
        # They are referenced from commit messages, changelog entries and messages to other teams,
        # so a collision cannot be repaired by renumbering after the fact -- a published commit
        # keeps the wrong id forever. The only affordable remedy is not making a second one.
        run: python scripts/check_roadmap_ids.py

      - name: Every JSON file parses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("spec").rglob("*.json")):
              json.loads(path.read_text())
              print(f"ok  {path}")
          PY

      - name: Contract cases are well-formed and fixtures resolve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          spec = Path("spec")
          manifest = json.loads((spec / "cases" / "manifest.json").read_text())
          cases = manifest["cases"]

          ids = [case["id"] for case in cases]
          assert len(ids) == len(set(ids)), "duplicate case ids"

          referenced = set()
          for case in cases:
              response = case["response"]
              name = response.get("body_file") or response["sse_file"]
              assert (spec / "fixtures" / name).exists(), f"{case['id']}: missing {name}"
              referenced.add(name)

          on_disk = {p.name for p in (spec / "fixtures").iterdir() if p.is_file()}
          orphans = on_disk - referenced
          assert not orphans, f"fixtures referenced by no case: {sorted(orphans)}"

          print(f"ok  {len(cases)} cases, {len(referenced)} fixtures")
          PY

      - name: SSE fixtures keep their literal wire framing
        run: |
          python - <<'PY'
          from pathlib import Path

          # These are captures, not documents: reformatting them would silently change what the
          # SDKs are tested against.
          for path in sorted(Path("spec/fixtures").glob("*.sse")):
              raw = path.read_bytes()
              assert b"\r" not in raw, f"{path}: CRLF line endings"
              assert raw.endswith(b"\n\n"), f"{path}: missing the terminating blank line"
              assert b"data: [DONE]\n" in raw, f"{path}: no [DONE] sentinel"
              print(f"ok  {path}")
          PY

      - name: Error catalog covers every documented field
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("spec/errors.json").read_text())

          for entry in catalog["gateway_errors"]:
              for field in ("status", "suffix", "meaning", "retryable"):
                  assert field in entry, f"{entry.get('suffix')}: missing {field}"

          for entry in catalog["oauth_errors"]:
              for field in ("status", "error", "meaning", "retryable"):
                  assert field in entry, f"{entry.get('error')}: missing {field}"

          suffixes = [entry["suffix"] for entry in catalog["gateway_errors"]]
          assert len(suffixes) == len(set(suffixes)), "duplicate error suffixes"

          print(f"ok  {len(suffixes)} gateway errors, {len(catalog['oauth_errors'])} oauth errors")
          PY
